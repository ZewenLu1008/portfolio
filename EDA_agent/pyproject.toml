[project]
name = "dataman"
version = "0.1.0"
description = "Dataman - Intelligent Data Cleaning & QA Agent using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai>=1.4.1",
    "langchain-core>=1.0.0",
    "langgraph>=1.2.10",
    "pandas>=3.0.5",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.11.0",
    "streamlit>=1.60.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
]
